plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = project.findProperty('neo_version')

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }

    runs {
        configureEach {
            gameDirectory = project.file('run')
            logLevel = org.slf4j.event.Level.INFO
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        client {
            client()
        }
        // Performance and look checks (matteroverdrive.client.PerfScene): ./gradlew :neoforge:runPerf -Pperf=stress|hands,
        // -Pjfr records a Java Flight Recording to run/perf.jfr
        perf {
            client()
            programArguments.addAll '--quickPlaySingleplayer', project.findProperty('world') ?: 'mo_scene'
            systemProperty 'matteroverdrive.perf', project.findProperty('perf') ?: 'stress'
            systemProperty 'matteroverdrive.perf.types', project.findProperty('types') ?: ''
            if (project.hasProperty('jfr')) {
                jvmArguments.add '-XX:StartFlightRecording=filename=perf.jfr,settings=profile'
            }
        }
        server {
            server()
            programArgument '--nogui'
        }
        // Scripted test scene (matteroverdrive.client.DevScene): joins run/saves/mo_scene, screenshots every
        // machine GUI to run/screenshots/scene_*.png and quits.
        scene {
            client()
            programArguments.addAll '--quickPlaySingleplayer', 'mo_scene'
            systemProperty 'matteroverdrive.scene', 'true'
            systemProperty 'matteroverdrive.scene.from', project.findProperty('sceneFrom') ?: '0'
        }
        // headless in-game tests (matteroverdrive.gametest), then exits
        gameTestServer {
            type = 'gameTestServer'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// neoforge.mods.toml comes from src/main/templates with the gradle properties
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata


tasks.withType(JavaCompile).configureEach { options.compilerArgs += ['-Xmaxerrs', '10000'] }
