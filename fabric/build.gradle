plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    // FE on Fabric: Team Reborn Energy (the common energy API of Fabric tech mods), shipped inside the jar
    modApi include("teamreborn:energy:${team_reborn_energy_version}")
    compileOnly 'io.github.llamalad7:mixinextras-common:0.5.0'
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.5.0'
}

loom {
    accessWidenerPath = file('src/main/resources/matteroverdrive.accesswidener')
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
    runs {
        client {
            client()
            runDir('run')
        }
        server {
            server()
            runDir('run')
        }
        // Scripted test scene (matteroverdrive.client.DevScene), as on NeoForge
        scene {
            client()
            name 'Scene'
            vmArg '-Dmatteroverdrive.scene=true'
            vmArg "-Dmatteroverdrive.scene.from=${project.findProperty('sceneFrom') ?: '0'}"
            programArgs '--quickPlaySingleplayer', 'mo_scene'
            runDir('run')
        }
        // headless in-game tests (fabric-gametest entrypoint), then exits
        gametest {
            server()
            name 'Game Test'
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get()}/gametest.xml"
            runDir('run-gametest')
        }
    }
}

tasks.withType(JavaCompile).configureEach { options.compilerArgs += ['-Xmaxerrs', '10000'] }

// 1.21.5+: game tests are test instances (data). NeoForge registers them from MOGameTests in code; on Fabric the same
// list becomes data files, generated from the MOGameTests.add(...) calls of the common sources.
def gameTestSources = rootProject.file('common/src/main/java/matteroverdrive/gametest')
def gameTestData = layout.buildDirectory.dir('generated/gametest')
def generateGameTests = tasks.register('generateGameTestInstances') {
    inputs.dir(gameTestSources)
    outputs.dir(gameTestData)
    doLast {
        def out = gameTestData.get().asFile
        out.deleteDir()
        def dir = new File(out, "data/${mod_id}")
        def environments = new File(dir, 'test_environment')
        def instances = new File(dir, 'test_instance')
        environments.mkdirs()
        instances.mkdirs()
        new File(environments, 'default.json').text = '{"type": "minecraft:all_of", "definitions": []}\n'
        def times = [] as Set
        int count = 0
        gameTestSources.eachFileMatch(~/.*\.java/) { file ->
            (file.text =~ /add\(\s*"([a-z0-9_]+)",\s*(\d+),\s*(true|false),\s*(?:(\d+),)?/).each { match, name, ticks, sky, time ->
                def environment = time == null ? 'default' : "time_${time}"
                if (time != null) times << time
                instances.toPath().resolve("${name}.json").text = """{
  "type": "minecraft:function",
  "function": "${mod_id}:${name}",
  "environment": "${mod_id}:${environment}",
  "structure": "${mod_id}:gametest_area",
  "max_ticks": ${ticks},
  "setup_ticks": 0,
  "required": true,
  "rotation": "none",
  "manual_only": false,
  "max_attempts": 1,
  "required_successes": 1,
  "sky_access": ${sky}
}
"""
                count++
            }
        }
        times.each { t -> new File(environments, "time_${t}.json").text = "{\"type\": \"minecraft:time_of_day\", \"time\": ${t}}\n" }
        if (count < 90) throw new GradleException("Only ${count} game tests found in ${gameTestSources}")
    }
}
processResources {
    from(generateGameTests)
}

// The release jar (remapJar) in a production client with Fabric API: the scripted scene outside dev
// (world: run-prod/saves/mo_scene, a copy of run/saves/mo_scene)
configurations.maybeCreate('productionRuntimeMods')
dependencies {
    productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
}
tasks.register('prodScene', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    jvmArgs.add('-Dmatteroverdrive.scene=true')
    programArgs.addAll('--quickPlaySingleplayer', 'mo_scene')
    runDir = project.layout.projectDirectory.dir('run-prod')
}

// Release jar without GameTests: the fabric-gametest entrypoint makes Fabric API scan the tests whenever a world opens
// (in production the scan failed and the world hung on "Preparing resources"), and 1.21.5+ test instances are data.
// Dev runs read build/resources, so runGametest keeps them. The entrypoint is the first one, so dropping its line
// leaves valid JSON.
tasks.named('jar') {
    exclude 'matteroverdrive/fabric/FabricTransferTests*', 'data/matteroverdrive/test_instance/**', 'data/matteroverdrive/test_environment/**'
    filesMatching('fabric.mod.json') { filter { String line -> line.contains('"fabric-gametest"') ? null : line } }
}
