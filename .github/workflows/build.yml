name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # gradle.properties points Gradle at the JDK 25 of the dev Mac; CI uses the one set up above
      - name: Drop the local JDK path
        run: sed -i '/^org.gradle.java.home=/d' gradle.properties

      - name: Build with Gradle
        run: ./gradlew build