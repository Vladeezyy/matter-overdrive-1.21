modLoader="javafml"
loaderVersion="[47,)"
license="${mod_license}"
issueTrackerURL="https://github.com/Vladeezyy/matter-overdrive-1.21/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/Vladeezyy/matter-overdrive-1.21"
logoFile="matteroverdrive_logo.png"
authors="Simeon Radivoev (original); port contributors"
description='''
A mod that dwells within matter and energy.
Unofficial port of Matter Overdrive (Simeon Radivoev, GPL-3.0) to Minecraft ${minecraft_version} / Forge.
'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
