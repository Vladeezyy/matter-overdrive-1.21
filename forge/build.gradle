plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev.legacyforge'
}

legacyForge {
    version = project.findProperty('forge_version')

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }

    runs {
        configureEach {
            gameDirectory = project.file('run')
            logLevel = org.slf4j.event.Level.INFO
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        // Scripted test scene (matteroverdrive.client.DevScene): joins run/saves/mo_scene, screenshots every
        // machine GUI to run/screenshots/scene_*.png and quits.
        scene {
            client()
            programArguments.addAll '--quickPlaySingleplayer', 'mo_scene'
            systemProperty 'matteroverdrive.scene', 'true'
            systemProperty 'matteroverdrive.scene.from', project.findProperty('sceneFrom') ?: '0'
        }
        // Performance and look checks (matteroverdrive.client.PerfScene): ./gradlew :forge:runPerf -Pperf=stress|hands,
        // -Pjfr records a Java Flight Recording to run/perf.jfr
        perf {
            client()
            programArguments.addAll '--quickPlaySingleplayer', project.findProperty('world') ?: 'mo_scene'
            systemProperty 'matteroverdrive.perf', project.findProperty('perf') ?: 'stress'
            systemProperty 'matteroverdrive.perf.types', project.findProperty('types') ?: ''
            if (project.hasProperty('jfr')) {
                jvmArguments.add '-XX:StartFlightRecording=filename=perf.jfr,settings=profile'
            }
        }
        // headless in-game tests (matteroverdrive.gametest), then exits
        gameTestServer {
            type = 'gameTestServer'
            // Forge 1.20.1 runs the tests in an ordinary server world (vanilla: a flat one): its own folder, flat
            gameDirectory = project.file('run-gametest')
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// mods.toml comes from src/main/templates with the gradle properties
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version_range    : forge_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata

// Forge 1.20.1's game test server is a dedicated server on server.properties: each run starts from a fresh flat world
def gameTestDir = file('run-gametest')
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst {
        new File(gameTestDir, 'world').deleteDir()
        gameTestDir.mkdirs()
        new File(gameTestDir, 'server.properties').text = 'level-type=minecraft\\:flat\ngenerate-structures=false\nspawn-monsters=false\nonline-mode=false\n'
        new File(gameTestDir, 'eula.txt').text = 'eula=true\n'
    }
}

tasks.withType(JavaCompile).configureEach { options.compilerArgs += ['-Xmaxerrs', '10000'] }
