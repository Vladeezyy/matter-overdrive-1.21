plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
    // the same access transformer as NeoForge (Fabric: the matching access widener)
    accessTransformers.from(rootProject.file('neoforge/src/main/resources/META-INF/accesstransformer.cfg'))
}

repositories {
    maven { url = 'https://maven.fabricmc.net' }
}

dependencies {
    // mixins live in common, both loaders ship Mixin at runtime
    compileOnly('net.fabricmc:sponge-mixin:0.15.4+mixin.0.8.7') { transitive = false }  // Minecraft pins its own asm
    compileOnly 'io.github.llamalad7:mixinextras-common:0.5.0'
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.5.0'
}

tasks.withType(JavaCompile).configureEach { options.compilerArgs += ['-Xmaxerrs', '10000'] }

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources file('src/main/resources')
}
