plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev.legacyforge'
}

legacyForge {
    // 1.20.1: the MCP (vanilla) setup does not apply access transformers, so common compiles on Forge userdev; Fabric
    // compiles the same sources on vanilla + the matching access widener, which catches any Forge-only call
    version = forge_version
    // the same access transformer as Forge (Fabric: the matching access widener)
    accessTransformers.from(rootProject.file('forge/src/main/resources/META-INF/accesstransformer.cfg'))
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

repositories {
    maven { url = 'https://maven.fabricmc.net' }
}

dependencies {
    // mixins live in common, both loaders ship Mixin at runtime
    compileOnly 'net.fabricmc:sponge-mixin:0.15.4+mixin.0.8.7'
    compileOnly 'io.github.llamalad7:mixinextras-common:0.5.0'
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.5.0'
}

tasks.withType(JavaCompile).configureEach { options.compilerArgs += ['-Xmaxerrs', '10000'] }

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources file('src/main/resources')
}
